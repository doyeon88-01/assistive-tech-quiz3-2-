<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보조공학 단어시험</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#202633;font-family:Arial,"Malgun Gothic",sans-serif}.wrap{max-width:850px;margin:auto;padding:24px 15px 50px}.card{background:white;border-radius:20px;padding:25px;box-shadow:0 6px 24px #0001}h1{margin:0 0 7px}.muted{color:#687386;margin-bottom:22px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;font-size:14px;display:block;margin-bottom:7px}select,input,button{font:inherit;border:0;border-radius:11px;padding:13px 14px}select,input{background:#eef2f8;width:100%;color:#202633}button{background:#263449;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{width:100%;margin-top:18px}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;gap:12px;color:#687386;font-size:14px;margin:18px 0 8px}.question{min-height:145px;border:1px solid #d7e0ec;border-radius:14px;background:#f8faff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:clamp(23px,4vw,32px);font-weight:bold;overflow-wrap:anywhere;line-height:1.45;white-space:normal}.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.choice{width:100%;min-height:62px;background:#eef3fa;color:#202633;text-align:left;border:2px solid transparent;line-height:1.45;overflow-wrap:anywhere;white-space:normal}.choice.correct{background:#e0f5e7;border-color:#39a365}.choice.wrong{background:#fde5e5;border-color:#d95757}.answerbox{margin-top:14px}.feedback{min-height:34px;text-align:center;font-weight:bold;margin:14px 0 4px;line-height:1.5;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}.secondary{background:#e8edf4;color:#263449}.score{text-align:center;margin:16px 0;color:#536176}@media(max-width:600px){.settings,.choices{grid-template-columns:1fr}.card{padding:18px}.question{min-height:125px}.actions{flex-direction:column}}
</style></head><body><div class="wrap"><main class="card"><h1>보조공학 단어시험</h1><div class="muted">이미지에 있는 32개 단어로 만든 시험</div>
<div id="setup"><div class="settings">
<div><label for="direction">문제 방향</label><select id="direction"><option value="enko">영어 → 한국어</option><option value="koen">한국어 → 영어</option></select></div>
<div><label for="kind">문제 유형</label><select id="kind"><option value="mc">객관식</option><option value="typing">주관식</option><option value="mixed">혼합</option></select></div>
<div><label for="count">문제 수</label><select id="count"><option value="10">10문제</option><option value="20">20문제</option><option value="32">32문제 전체</option></select></div>
<div><label for="order">출제 순서</label><select id="order"><option value="random">랜덤</option><option value="list">표 순서</option></select></div></div><button class="primary" id="start">시험 시작</button></div>
<section id="quiz" class="hidden"><div class="topline"><span id="progress"></span><span id="liveScore"></span></div><div class="question" id="question"></div><div class="choices" id="choices"></div>
<div class="answerbox hidden" id="answerbox"><input id="answer" autocomplete="off" placeholder="정답을 입력하세요"><button id="submit" class="primary">정답 확인</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button id="next" disabled>다음 문제</button><button id="restart" class="secondary">설정으로</button></div></section>
<section id="result" class="hidden"><div class="question">시험 완료!</div><div class="score" id="resultText"></div><button class="primary" id="again">다시 시험하기</button><button class="primary secondary" id="back">설정으로 돌아가기</button></section></main></div>
<script>
const DATA=[{"en": "Amputation", "ko": "하지 절단"}, {"en": "Biceps brachi", "ko": "위팔두갈래근"}, {"en": "Brachioradialis", "ko": "위팔노근"}, {"en": "Closed fracture", "ko": "닫힌 골절"}, {"en": "Control", "ko": "제어"}, {"en": "Circumferential Compression", "ko": "원주성 압박"}, {"en": "Deltoid", "ko": "어깨 세모근"}, {"en": "Dorsi flexion", "ko": "손목 신전"}, {"en": "Edema", "ko": "부종"}, {"en": "Healing", "ko": "치유"}, {"en": "Humerus", "ko": "위팔뼈"}, {"en": "Infraspinatus", "ko": "가시아래근"}, {"en": "Long Thoracic Nerve", "ko": "긴가슴신경"}, {"en": "Open fracture", "ko": "개방성 골절"}, {"en": "Overstretching", "ko": "과도한 늘림"}, {"en": "Overuse", "ko": "과사용"}, {"en": "Prevention", "ko": "예방, 방지"}, {"en": "Radial Nerve Palsy", "ko": "요골신경 마비"}, {"en": "Re-triming", "ko": "재트리밍"}, {"en": "Retraction", "ko": "뒤당김"}, {"en": "Rotator Cuff", "ko": "회전근개"}, {"en": "Scapula", "ko": "어깨뼈"}, {"en": "Serratus Anterior", "ko": "앞톱니근"}, {"en": "Sling", "ko": "슬링"}, {"en": "Static", "ko": "고정"}, {"en": "Stabilization", "ko": "안정"}, {"en": "Subluxation", "ko": "아탈구"}, {"en": "Supraspinatus", "ko": "가시위근"}, {"en": "Tennis Elbow", "ko": "테니스 엘보"}, {"en": "Ulnar deviation", "ko": "자쪽 편위"}, {"en": "Winging Scapula", "ko": "날개 어깨뼈"}, {"en": "Wrist Drop", "ko": "손목 처짐"}];let questions=[],index=0,score=0,locked=false,direction="enko";const $=id=>document.getElementById(id);
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function norm(s){return s.trim().toLowerCase().replace(/\s+/g," ")}
function start(){direction=$("direction").value;let list=$("order").value==="random"?shuffle(DATA):[...DATA];questions=list.slice(0,+$("count").value).map(item=>({...item,type:$("kind").value==="mixed"?(Math.random()<.5?"mc":"typing"):$("kind").value}));index=0;score=0;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){locked=false;let q=questions[index];$("progress").textContent=`${index+1} / ${questions.length}`;$("liveScore").textContent=`정답 ${score}개`;$("question").textContent=direction==="enko"?q.en:q.ko;$("choices").innerHTML="";$("answerbox").classList.add("hidden");$("feedback").textContent="";$("next").disabled=true;$("next").textContent=index===questions.length-1?"결과 보기":"다음 문제";
if(q.type==="typing"){$("answerbox").classList.remove("hidden");$("answer").value="";$("answer").disabled=false;$("submit").disabled=false;$("answer").placeholder=direction==="enko"?"한국어 뜻을 입력하세요":"영어 단어를 입력하세요";setTimeout(()=>$("answer").focus(),0)}
else{let correct=direction==="enko"?q.ko:q.en;let opts=shuffle([correct,...shuffle(DATA.filter(x=>x!==q)).slice(0,3).map(x=>direction==="enko"?x.ko:x.en)]);opts.forEach((v,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=`${i+1}. ${v}`;b.onclick=()=>choose(b,v===correct,correct);$("choices").appendChild(b)})}}
function finish(ok,correct){if(locked)return;locked=true;if(ok){score++;$("feedback").textContent="⭕ 정답입니다!"}else{$("feedback").textContent=`❌ 오답입니다. 정답: ${correct}`} $("liveScore").textContent=`정답 ${score}개`;$("next").disabled=false}
function choose(btn,ok,correct){document.querySelectorAll(".choice").forEach(b=>b.disabled=true);btn.classList.add(ok?"correct":"wrong");if(!ok)document.querySelectorAll(".choice").forEach(b=>{if(b.textContent.slice(3)===correct)b.classList.add("correct")});finish(ok,correct)}
function submit(){let q=questions[index],correct=direction==="enko"?q.ko:q.en;$("answer").disabled=true;$("submit").disabled=true;finish(norm($("answer").value)===norm(correct),correct)}
function next(){if(!locked)return;if(index<questions.length-1){index++;render()}else{$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("resultText").textContent=`총 ${questions.length}문제 중 ${score}문제 정답 · ${Math.round(score/questions.length*100)}점`}}
function back(){$("quiz").classList.add("hidden");$("result").classList.add("hidden");$("setup").classList.remove("hidden")}
$("start").onclick=start;$("next").onclick=next;$("submit").onclick=submit;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});$("restart").onclick=back;$("back").onclick=back;$("again").onclick=start;
</script></body></html>
